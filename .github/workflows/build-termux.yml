name: build-termux

# Builds the patched opencode aarch64 binary for Termux and attaches it to a release.
#
# Two workflows in one file:
#   - workflow_dispatch  -> build only, binary as a downloadable artifact
#   - push a tag v*      -> build and attach to a GitHub Release
#
# The runner is a normal Ubuntu x64 box: `bun build --compile --target=bun-linux-arm64`
# cross-compiles fine, and everything native (pty, @opentui/core) is pulled from npm
# for the arm64/gnu pair by the build script itself.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream opencode ref (branch, tag or SHA). Default is the SHA this patch was verified against."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UPSTREAM: anomalyco/opencode
  BUN_VERSION: "1.4.4"
  # The commit `patch/opencode-custom-connect.patch` was last verified against.
  # Bump this (and re-test) rather than tracking a moving branch. Must be a
  # currently-reachable commit: GitHub will not serve an arbitrary bare SHA.
  # Verified clean on both d0cffe1 and 144438a.
  UPSTREAM_SHA: "144438a"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: ref
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$REF" ]; then REF="${UPSTREAM_SHA}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "building on upstream $REF"

      - name: Fetch upstream source
        run: |
          git init -q upstream
          cd upstream
          git remote add origin "https://github.com/${UPSTREAM}.git"
          REF="${{ steps.ref.outputs.ref }}"
          reached=0

          # 1. Branch or tag name: a plain shallow fetch works.
          if git fetch -q --depth 1 origin "$REF" 2>/dev/null; then
            git checkout -q FETCH_HEAD
            reached=1
            echo "fetched $REF directly"
          fi

          # 2. A bare SHA: upload-pack will not accept a want-line for an
          #    unadvertised commit, so fetch dev shallow and deepen until it
          #    appears in history.
          if [ "$reached" -eq 0 ]; then
            git fetch -q --depth 1 origin dev
            for d in 100 500 2000 10000; do
              if git cat-file -e "${REF}^{commit}" 2>/dev/null; then break; fi
              git fetch -q --deepen "$d" origin dev || break
            done
            if git cat-file -e "${REF}^{commit}" 2>/dev/null; then
              git checkout -q "$REF"
              reached=1
              echo "deepened until $REF was reachable"
            fi
          fi

          # 3. Pinned commit has aged out of reachable history: build dev tip,
          #    but say so, and let the patch check below decide if that is safe.
          if [ "$reached" -eq 0 ]; then
            echo "::warning::$REF is not reachable upstream; building the tip of dev instead"
            git checkout -q FETCH_HEAD
          fi

          echo "upstream commit: $(git rev-parse HEAD)"

      - name: Apply the custom /connect patch
        run: |
          cd upstream
          # Fail loudly if upstream moved in a way that breaks the patch, rather
          # than shipping a binary without the change.
          if ! git apply --check "$GITHUB_WORKSPACE/patch/opencode-custom-connect.patch"; then
            echo "::error::patch no longer applies to $(git rev-parse --short HEAD). Re-verify it against this commit."
            exit 1
          fi
          git apply "$GITHUB_WORKSPACE/patch/opencode-custom-connect.patch"
          test -f packages/tui/src/component/dialog-custom-connect.tsx || { echo "::error::patch did not land"; exit 1; }
          echo "patch applied; dialog present"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: upstream
        run: bun install

      - name: Build aarch64 (glibc, for Termux via glibc-runner)
        working-directory: upstream/packages/cli
        env:
          # build.ts takes the target as an env var, not a flag. It compares
          # against targetName(), which is `<os>-<arch>` — no "cli-" prefix.
          OPENCODE_TARGET: linux-arm64
          BUN_COMPILE_RELEASE: bun-v${{ env.BUN_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do NOT pass --skip-install: it is what pulls the arm64 native packages
          # (@opencui/core, @opencode/pty) that get embedded in the binary.
          bun run script/build.ts --skip-web-ui
          # build.ts renames the target by replacing the binary name with
          # "cli", so the directory is dist/cli-linux-arm64 even though
          # OPENCODE_TARGET is linux-arm64. Discover it rather than assume.
          find dist -maxdepth 3 -name opencode -type f -print
          test -n "$(find dist -maxdepth 3 -name opencode -type f -print -quit)" || {
            echo "::error::no opencode binary under dist"; ls -la dist || true; exit 1; }

      - name: Verify the artifact is really aarch64
        working-directory: upstream/packages/cli
        run: |
          BIN=dist/opencode-linux-arm64/bin/opencode
          test -x "$BIN" || { echo "::error::binary missing"; exit 1; }
          file "$BIN"
          readelf -h "$BIN" | grep -E "Machine|Class"
          readelf -d "$BIN" | grep NEEDED
          # refuse to ship anything that is not aarch64
          readelf -h "$BIN" | grep -q "AArch64" || { echo "::error::not an aarch64 binary"; exit 1; }

      - name: Package
        run: |
          mkdir -p out
          cp upstream/packages/cli/dist/opencode-linux-arm64/bin/opencode out/opencode
          chmod +x out/opencode
          tar -czf "out/opencode-termux-aarch64.tar.gz" -C out opencode
          sha256sum out/opencode-termux-aarch64.tar.gz | tee out/SHA256SUMS
          du -h out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-aarch64
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/opencode-termux-aarch64.tar.gz
            out/SHA256SUMS
          generate_release_notes: true
          body: |
            Patched opencode for Termux (aarch64, Android 9+).

            `opencode-custom-connect.patch` applied on top of upstream
            `${{ steps.ref.outputs.ref }}` @ `${{ github.sha }}`.
            `/connect` opens a custom-endpoint form instead of the provider catalogue.

            **Install**

            ```bash
            pkg install glibc-repo
            pkg update && pkg install glibc glibc-runner
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/termux/install.sh | bash
            ```
